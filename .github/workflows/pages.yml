name: Check and publish
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "memory/**", "README.md", "ASSET_LICENSES.md", "deploy/README.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run decks:build && git diff --exit-code -- tests/fixtures/demo
      - run: npm test
      - run: npm run test:deploy
      - uses: actions/cache@v4
        with:
          path: .cache/piclex-content
          key: public-content-${{ hashFiles('content/snapshot.json') }}
          restore-keys: public-content-
      - run: npm run content:build
        env:
          PICLEX_CONTENT_CACHE: .cache/piclex-content
      - run: npm run build
      - run: node scripts/write-public-release-manifest.mjs
      - name: Use responsive Ubuntu package mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ] && grep -q 'azure.archive.ubuntu.com' /etc/apt/apt-mirrors.txt; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps chrome webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
