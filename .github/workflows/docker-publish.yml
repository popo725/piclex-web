name: Publish Docker image
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "memory/**", "README.md", "ASSET_LICENSES.md", "deploy/**"]
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Docker Hub configuration
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$USERNAME" && test -n "$TOKEN" || { echo 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets.'; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: piclex-web:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container and bundled content
        run: |
          docker run -d --name piclex-verify --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:18121:8080 piclex-web:verify
          trap 'docker logs piclex-verify; docker rm -f piclex-verify' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18121/healthz; then break; fi
            sleep 1
          done
          node scripts/test-docker.mjs http://127.0.0.1:18121
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/piclex-web
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Publish AMD64 and ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
