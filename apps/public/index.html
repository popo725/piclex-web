<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><style>
#boot-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;--boot-bg:#fafafa;--boot-ink:#242424;background:var(--boot-bg);color:var(--boot-ink);font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot-loader .boot-game{position:relative;width:108px;height:32px}
#boot-loader .boot-pac{position:absolute;z-index:1;left:0;top:0;width:32px;height:32px}
#boot-loader .boot-pac svg{display:block;width:32px;height:32px;fill:var(--boot-ink)}
#boot-loader .boot-frame{opacity:0;animation-duration:.48s;animation-timing-function:steps(1,end);animation-iteration-count:infinite}
#boot-loader .boot-frame-a{animation-name:boot-chomp-a}#boot-loader .boot-frame-b{animation-name:boot-chomp-b}#boot-loader .boot-frame-c{animation-name:boot-chomp-c}
#boot-loader .boot-eye{fill:var(--boot-bg)}
#boot-loader .boot-dot{position:absolute;left:34px;top:13px;width:4px;height:4px;border-radius:0;background:var(--boot-ink);animation:boot-pellet 1.2s steps(25,end) infinite}
#boot-loader .boot-dot:nth-child(3){animation-delay:-.4s}#boot-loader .boot-dot:nth-child(4){animation-delay:-.8s}
@keyframes boot-chomp-a{0%{opacity:1;animation-timing-function:steps(1,end)}25%{opacity:0}}
@keyframes boot-chomp-b{0%{opacity:0;animation-timing-function:steps(1,end)}25%{opacity:1;animation-timing-function:steps(1,end)}50%{opacity:0;animation-timing-function:steps(1,end)}75%{opacity:1}}
@keyframes boot-chomp-c{0%{opacity:0;animation-timing-function:steps(1,end)}50%{opacity:1;animation-timing-function:steps(1,end)}75%{opacity:0}}
@keyframes boot-pellet{0%{transform:translateX(70px)}100%{transform:translateX(-30px)}}
@media(prefers-color-scheme:dark){#boot-loader{--boot-bg:#171717;--boot-ink:#eee}}
@media(prefers-reduced-motion:reduce){#boot-loader .boot-frame{animation:none}#boot-loader .boot-frame-b{opacity:1}#boot-loader .boot-dot{animation:none}#boot-loader .boot-dot:nth-child(2){transform:translateX(0)}#boot-loader .boot-dot:nth-child(3){transform:translateX(22px)}#boot-loader .boot-dot:nth-child(4){transform:translateX(44px)}}
