<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><style>
#boot-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#fafafa;color:#242424;font:500 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot-loader .boot-game{position:relative;width:122px;height:36px}
#boot-loader .boot-pac{position:absolute;left:0;top:1px;width:34px;height:34px}
#boot-loader .boot-pac:before,#boot-loader .boot-pac:after{content:"";position:absolute;left:0;width:34px;height:17px;background:#f3c442}
#boot-loader .boot-pac:before{top:0;border-radius:18px 18px 0 0;transform-origin:50% 100%;transform:rotate(-24deg);animation:boot-chomp-top .38s ease-in-out infinite alternate}
#boot-loader .boot-pac:after{bottom:0;border-radius:0 0 18px 18px;transform-origin:50% 0;transform:rotate(24deg);animation:boot-chomp-bottom .38s ease-in-out infinite alternate}
#boot-loader .boot-eye{position:absolute;z-index:1;left:20px;top:7px;width:3px;height:3px;border-radius:50%;background:#5b430e}
#boot-loader .boot-dot{position:absolute;left:34px;top:16px;width:5px;height:5px;border-radius:50%;background:currentColor;animation:boot-pellet 1.5s linear infinite}
#boot-loader .boot-dot:nth-child(3){animation-delay:-.5s}#boot-loader .boot-dot:nth-child(4){animation-delay:-1s}
@keyframes boot-chomp-top{to{transform:rotate(0)}}@keyframes boot-chomp-bottom{to{transform:rotate(0)}}
@keyframes boot-pellet{0%{transform:translateX(82px);opacity:0}12%,82%{opacity:.6}100%{transform:translateX(0);opacity:0}}
@media(prefers-color-scheme:dark){#boot-loader{background:#171717;color:#eee}}
@media(prefers-reduced-motion:reduce){#boot-loader .boot-pac:before,#boot-loader .boot-pac:after,#boot-loader .boot-dot{animation:none}#boot-loader .boot-dot:nth-child(2){transform:translateX(26px)}#boot-loader .boot-dot:nth-child(3){transform:translateX(48px)}#boot-loader .boot-dot:nth-child(4){transform:translateX(70px)}}
</style><meta name="theme-color" content="#ffffff"/><meta name="description" content="用一张照片，记住身边的英语。摄影学英语 开源网页版，无需登录即可看图拼词，支持导入自己的照片卡组。"/><link rel="icon" type="image/png" href="./brand/app-icon.png"/><link rel="apple-touch-icon" href="./brand/app-icon.png"/><link rel="preload" as="image" crossorigin href="%BASE_URL%icons/tab-capture.png" fetchpriority="high"/><link rel="preload" as="fetch" crossorigin href="%BASE_URL%icons/tab-capture-frames.png"/><link rel="preload" as="image" crossorigin href="%BASE_URL%icons/tab-learn.png" fetchpriority="high"/><link rel="preload" as="fetch" crossorigin href="%BASE_URL%icons/tab-learn-frames.png"/><link rel="preload" as="image" crossorigin href="%BASE_URL%icons/tab-settings.png" fetchpriority="high"/><link rel="preload" as="fetch" crossorigin href="%BASE_URL%icons/tab-settings-frames.png"/><title>摄影学英语 · 把眼前的生活，变成英语</title></head><body><div id="boot-loader" role="status" aria-label="页面加载中"><div class="boot-game" aria-hidden="true"><span class="boot-pac"><span class="boot-eye"></span></span><span class="boot-dot"></span><span class="boot-dot"></span><span class="boot-dot"></span></div><span>正在打开摄影学英语…</span></div><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
