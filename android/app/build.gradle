plugins {
    id 'com.android.application'
}
android {
    namespace 'com.piclex.portable'
    compileSdk 35
    defaultConfig {
        applicationId 'com.piclex.portable'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}
